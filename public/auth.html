<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <title>GetPlace — Log In</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1720">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2322c55e'/%3E%3Cpath d='M16 6a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/auth.css">
</head>
<body>
  <header class="bar">
    <a class="brand" href="/" aria-label="GetPlace Map">
      <span class="logo"><svg viewBox="0 0 24 24" class="i" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg></span>
      <span class="brand-name">GetPlace</span>
    </a>
    <a class="edit" href="/edit/"><span data-i18n="edit">Edit</span></a>
    <span class="spacer"></span>
    <div class="lang-wrap">
      <button id="lang-btn" class="ghost" type="button" aria-haspopup="true" aria-label="Language"><span id="lang-code">UZ</span></button>
      <div id="lang-menu" class="menu" hidden>
        <button data-lang="uz">O‘zbekcha</button>
        <button data-lang="ru">Русский</button>
        <button data-lang="en">English</button>
      </div>
    </div>
  </header>

  <section class="hero" aria-hidden="true">
    <svg viewBox="0 0 900 230" preserveAspectRatio="xMidYMax slice">
      <defs>
        <linearGradient id="g-globe" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#22c55e"/></linearGradient>
        <radialGradient id="g-glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#22c55e" stop-opacity=".35"/><stop offset="1" stop-color="#22c55e" stop-opacity="0"/></radialGradient>
        <clipPath id="c-globe"><circle cx="620" cy="250" r="190"/></clipPath>
      </defs>
      <circle cx="620" cy="250" r="260" fill="url(#g-glow)"/>
      <circle cx="620" cy="250" r="190" fill="url(#g-globe)" opacity=".9"/>
      <g clip-path="url(#c-globe)" fill="none" stroke="#fff" stroke-opacity=".25" stroke-width="1.5">
        <ellipse cx="620" cy="250" rx="190" ry="70"/><ellipse cx="620" cy="250" rx="190" ry="130"/>
        <ellipse cx="620" cy="250" rx="70" ry="190"/><ellipse cx="620" cy="250" rx="130" ry="190"/>
        <line x1="430" y1="250" x2="810" y2="250"/><line x1="620" y1="60" x2="620" y2="440"/>
      </g>
      <path d="M270 190 C340 120 420 175 500 120 S600 70 640 96" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round" opacity=".8"/>
      <circle cx="270" cy="190" r="6" fill="#fff"/>
      <path d="M640 52a20 20 0 0 0-20 20c0 15 20 36 20 36s20-21 20-36a20 20 0 0 0-20-20zm0 27a7 7 0 1 1 0-14 7 7 0 0 1 0 14z" fill="#fff"/>
    </svg>
  </section>

  <nav class="tabs" role="tablist">
    <a id="tab-login" role="tab" href="/login" data-i18n="login">Log In</a>
    <a id="tab-signup" role="tab" href="/signup" data-i18n="signup">Sign Up</a>
  </nav>

  <main class="wrap">
    <!-- Already signed in -->
    <section id="already" hidden>
      <p id="already-text"></p>
      <div class="row">
        <a id="already-continue" class="btn" href="/" data-i18n="continueBtn">Continue</a>
        <button id="already-logout" class="btn secondary" type="button" data-i18n="logout">Log out</button>
      </div>
    </section>

    <form id="auth-form" novalidate>
      <p id="oauth-note" class="note" data-i18n="oauthNote" hidden>Log in to open the editor.</p>
      <p id="intro" class="intro"></p>

      <!-- Step 1: the form (fields depend on the page: login / signup / forgot) -->
      <div id="step-form">
        <div class="field" data-modes="signup">
          <label for="display-name" data-i18n="displayName">Display name</label>
          <input id="display-name" type="text" maxlength="30" autocomplete="nickname" spellcheck="false">
          <small data-i18n="nameHint">Other mappers will see this name.</small>
        </div>
        <div class="field">
          <label for="email" data-i18n="email">Email address</label>
          <input id="email" type="email" inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false" placeholder="name@example.com" maxlength="254" required>
        </div>
        <div class="field" data-modes="login signup">
          <label for="password" data-i18n="password">Password</label>
          <div class="pw">
            <input id="password" type="password" maxlength="128" autocomplete="current-password">
            <button class="pw-toggle" type="button" tabindex="-1"></button>
          </div>
          <small data-modes="signup" data-i18n="passwordHint">At least 8 characters.</small>
        </div>
        <div class="field" data-modes="signup">
          <label for="password2" data-i18n="passwordConfirm">Confirm password</label>
          <input id="password2" type="password" maxlength="128" autocomplete="new-password">
        </div>
        <label class="check" data-modes="signup"><input id="terms" type="checkbox"><span data-i18n="terms">I agree to the terms of use.</span></label>
        <div class="row spread" data-modes="login">
          <label class="check inline"><input id="remember" type="checkbox" checked><span data-i18n="remember">Remember me</span></label>
          <a id="forgot-link" href="/forgot" data-i18n="forgotLink">Forgot your password?</a>
        </div>
        <button id="send" class="btn" type="submit"></button>
      </div>

      <!-- Step 2: the e-mailed code (confirm the new account once, or reset a password) -->
      <div id="step-code" hidden>
        <p id="info" class="note" hidden></p>
        <p id="sent-to" class="note"></p>
        <p class="note small" data-i18n="checkSpam">Check your spam folder if the e-mail does not arrive.</p>
        <p id="dev-note" class="dev" hidden><span data-i18n="devCode">Dev mode. Code:</span> <b id="dev-code"></b></p>
        <div class="field">
          <label for="code" data-i18n="codeLabel">Verification code</label>
          <input id="code" class="code" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" placeholder="••••••">
        </div>
        <div id="reset-fields" hidden>
          <div class="field">
            <label for="newpw" data-i18n="passwordNew">New password</label>
            <div class="pw">
              <input id="newpw" type="password" maxlength="128" autocomplete="new-password">
              <button class="pw-toggle" type="button" tabindex="-1"></button>
            </div>
            <small data-i18n="passwordHint">At least 8 characters.</small>
          </div>
          <div class="field">
            <label for="newpw2" data-i18n="passwordConfirm">Confirm password</label>
            <input id="newpw2" type="password" maxlength="128" autocomplete="new-password">
          </div>
        </div>
        <button id="verify" class="btn" type="button"></button>
        <div class="row links">
          <button id="resend" class="link" type="button" disabled></button>
          <button id="back" class="link" type="button" data-i18n="changeEmail">Change e-mail</button>
        </div>
      </div>

      <p id="msg" class="msg" role="alert" aria-live="polite" hidden></p>
    </form>

    <p class="alt"><span id="alt-text"></span> <a id="alt-link" href="#"></a></p>
  </main>

  <script src="/i18n.js"></script>
  <script src="/auth-strings.js"></script>
  <script src="/auth.js"></script>
</body>
</html>
