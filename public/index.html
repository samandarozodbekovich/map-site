<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <title>GetPlace Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1720">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2322c55e'/%3E%3Cpath d='M16 6a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="vendor/maplibre-gl.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="map"></div>

  <!-- Top bar -->
  <header id="topbar">
    <a class="brand" href="/" aria-label="GetPlace Map">
      <span class="logo"><i data-icon="pin"></i></span>
      <span class="brand-name">GetPlace</span>
    </a>

    <div class="edit-split">
      <a id="edit-link" class="edit-main" href="/edit/"><i data-icon="pencil"></i><span data-i18n="edit">Edit</span></a>
      <button id="edit-more" class="edit-caret" type="button" aria-label="Edit menu" aria-haspopup="true"><i data-icon="chevron"></i></button>
      <div id="edit-menu" class="menu" hidden>
        <a id="edit-id" href="/edit/"><b>iD</b> <small data-i18n="editIdDesc">In-browser editor</small></a>
      </div>
    </div>

    <nav id="nav" aria-label="Main">
      <button data-panel="history"><span data-i18n="history">History</span></button>
      <button data-panel="export"><span data-i18n="export">Export</span></button>
      <button data-panel="traces"><span data-i18n="traces">GPS Traces</span></button>
      <button data-panel="diaries"><span data-i18n="diaries">User Diaries</span></button>
      <button data-panel="communities"><span data-i18n="communities">Communities</span></button>
      <button data-panel="copyright"><span data-i18n="copyright">Copyright</span></button>
      <button data-panel="help"><span data-i18n="help">Help</span></button>
      <button data-panel="about"><span data-i18n="about">About</span></button>
    </nav>

    <div class="spacer"></div>

    <div class="lang-wrap">
      <button id="lang-btn" class="icon-btn" type="button" aria-label="Language" aria-haspopup="true"><i data-icon="globe"></i><span id="lang-code">UZ</span></button>
      <div id="lang-menu" class="menu right" hidden>
        <button data-lang="uz">O‘zbekcha</button>
        <button data-lang="ru">Русский</button>
        <button data-lang="en">English</button>
      </div>
    </div>
    <div class="auth" id="auth-guest">
      <a class="ghost" id="login-link" href="/login" data-i18n="login">Log In</a>
      <a class="solid" id="signup-link" href="/signup" data-i18n="signup">Sign Up</a>
    </div>
    <div class="user-wrap" id="auth-user" hidden>
      <button id="user-btn" class="icon-btn" type="button" aria-haspopup="true" aria-label="Account"><span class="avatar" id="user-initial"></span><span id="user-name"></span></button>
      <div id="user-menu" class="menu right" hidden>
        <button id="logout-btn" type="button" data-i18n="logout">Log out</button>
      </div>
    </div>
    <button id="burger" class="icon-btn" type="button" aria-label="Menu"><i data-icon="menu"></i></button>
  </header>

  <!-- Search card -->
  <form id="search" role="search" autocomplete="off">
    <i data-icon="search" class="lead"></i>
    <input id="q" type="search" data-i18n-ph="search" placeholder="Search" aria-label="Search">
    <button id="where" type="button" class="where" data-i18n="whereIsThis">Where is this?</button>
    <button type="submit" class="go" aria-label="Search"><i data-icon="search"></i></button>
    <button id="directions" type="button" class="dir" aria-label="Directions"><i data-icon="directions"></i></button>
  </form>

  <!-- Side panel -->
  <aside id="sidebar" hidden>
    <header>
      <h2 id="side-title"></h2>
      <button id="side-close" class="icon-btn" type="button" aria-label="Close"><i data-icon="x"></i></button>
    </header>
    <div id="side-body"></div>
  </aside>

  <!-- Right toolbar -->
  <div id="tools" role="toolbar">
    <div class="group">
      <button id="zoom-in" type="button" aria-label="Zoom in"><i data-icon="plus"></i></button>
      <button id="zoom-out" type="button" aria-label="Zoom out"><i data-icon="minus"></i></button>
      <button id="locate" type="button" aria-label="My location"><i data-icon="locate"></i></button>
    </div>
    <div class="group">
      <button data-panel="layers" type="button" aria-label="Layers"><i data-icon="layers"></i></button>
      <button data-panel="legend" type="button" aria-label="Legend"><i data-icon="info"></i></button>
      <button data-panel="share" type="button" aria-label="Share"><i data-icon="share"></i></button>
      <button data-panel="note" type="button" aria-label="Notes"><i data-icon="note"></i></button>
      <button data-panel="help" type="button" aria-label="Help"><i data-icon="help"></i></button>
    </div>
  </div>

  <div id="scales"></div>
  <div id="attribution">
    &copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap contributors</a>
    <span class="sep">·</span> <a href="https://data.nextgis.com" target="_blank" rel="noopener">NextGIS Data</a>
    <span class="sep">·</span> <a href="https://opendatacommons.org/licenses/odbl/1.0/" target="_blank" rel="noopener">ODbL</a>
  </div>

  <div id="toast" hidden></div>

  <script src="vendor/maplibre-gl.js"></script>
  <script src="i18n.js"></script>
  <script src="auth-strings.js"></script>
  <script src="app.js"></script>
</body>
</html>
