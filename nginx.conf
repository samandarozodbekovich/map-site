server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    add_header Cache-Control "no-cache";

    location ~ ^/(vendor|icons)/ { add_header Cache-Control "public, max-age=86400"; }

    # login / sign-up pages (same URLs as openstreetmap.org: /login and /user/new)
    location ~ ^/(login|signup|forgot|user/new)/?$ { try_files /auth.html =404; }

    # terms of use and privacy policy (one page; the path picks the document)
    location ~ ^/(terms|privacy)/?$ { try_files /legal.html =404; }

    location / { try_files $uri $uri/ /index.html; }
}
