server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # login / sign-up pages (same URLs as openstreetmap.org: /login and /user/new)
    location ~ ^/(login|signup|forgot|user/new)/?$ { try_files /auth.html =404; }

    location / { try_files $uri $uri/ /index.html; }
}
